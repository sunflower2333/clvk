name: Windows VIOGPU OpenCL
on:
  push:
    branches: [viogpu-windows-opencl, work/flat-runtime-20260912, work/flat-duration-dispatch-20260913]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check production bounded recorder and duration admission
        run: |
          clang++ -std=c++17 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread tools/dispatch-trace-check.cpp -o dispatch-trace-check
          ./dispatch-trace-check
          clang++ -std=c++17 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread tools/batch-duration-check.cpp -o batch-duration-check
          ./batch-duration-check
  compiler:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Package matching upstream compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34487278874 -R kpet/clvk -n clvk-windows-2022---compiler-true-online-false -D upstream
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item upstream/clspv.exe
          $expected = '79E236AF8FEBD67FD02ADFD93F81295C87E868E9FD861F71D03D1057E6BE1F9D'
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Compiler identity mismatch' }
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (!$crt) { throw 'Missing x64 compiler CRT' }
          python tools/flat-pe.py --compiler $exe.FullName --crt $crt.FullName --output compiler
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & compiler/viogpu_clspv_x64.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'upstream_run=34487278874; clspv_source=c20f7c8ccf58f317972ac1ffeab68a96019cbbaa; compiler_machine=AMD64; compiler_only=true' | Out-File compiler/source.txt
          $hashes = Get-ChildItem compiler -File | Get-FileHash -Algorithm SHA256
          $hashes | Format-List | Out-File compiler/sha256.txt
          $hashes | ForEach-Object { $_.Hash + '  ' + [IO.Path]::GetFileName($_.Path) } | Set-Content compiler/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: viogpu-opencl-compiler-x64
          path: compiler/
          if-no-files-found: error
  build:
    needs: compiler
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            msvc: amd64_arm64
          - arch: x64
            msvc: amd64
          - arch: x86
            msvc: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: viogpu-opencl-compiler-x64
          path: compiler
      - name: Fetch pinned dependencies
        shell: pwsh
        run: |
          git submodule update --init --depth=1 external/clspv external/OpenCL-Headers external/SPIRV-Headers external/SPIRV-Tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --depth=1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Headers.git build/vulkan-headers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --depth=1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Loader.git build/vulkan-loader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build matching Vulkan loader and OpenCL runtime
        shell: pwsh
        run: |
          $prefix = "$pwd/build/deps"
          $vendor = 'viogpucl_${{ matrix.arch }}'
          $privateVk = 'viogpucl_vk_${{ matrix.arch }}'
          cmake -S build/vulkan-headers -B build/headers -G Ninja "-DCMAKE_INSTALL_PREFIX=$prefix" -DVULKAN_HEADERS_ENABLE_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/headers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S cmake/private-vulkan -B build/loader -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCLVK_VULKAN_SOURCE=$pwd/build/vulkan-loader" "-DCLVK_VULKAN_NAME=$privateVk" "-DCMAKE_INSTALL_PREFIX=$prefix" "-DCMAKE_PREFIX_PATH=$prefix" -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/loader --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/loader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DCMAKE_PREFIX_PATH=$prefix" "-DVulkan_INCLUDE_DIR=$prefix/include" "-DVulkan_LIBRARY=$prefix/lib/$privateVk.lib" "-DCLVK_WINDOWS_OUTPUT_NAME=$vendor" -DCLVK_WINDOWS_FLAT_DRIVER=ON -DCLVK_EXTERNAL_CLSPV=ON -DCLVK_ENABLE_SPIRV_IL=OFF -DCLVK_BUILD_TESTS=OFF -DCLVK_ENABLE_ASSERTIONS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/runtime --parallel 3 --target OpenCL
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -Type Directory -Force build/package | Out-Null
          cmake --install build/runtime --prefix build/package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$prefix/bin/$privateVk.dll" build/package/
          cl /nologo /EHsc /std:c++17 /MT /DWIN32 /DNOMINMAX /Isrc /Iexternal/OpenCL-Headers /Iexternal/SPIRV-Headers/include "/I$prefix/include" src/utils.cpp tools/windows-exec-check.cpp /Febuild/package/windows-exec-check-${{ matrix.arch }}.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ matrix.arch }}' -ne 'arm64') {
            & build/package/windows-exec-check-${{ matrix.arch }}.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cl /nologo /EHsc /std:c++17 /MT /Iexternal/OpenCL-Headers tools/viogpu-opencl-check.cpp /Febuild/package/viogpu-opencl-check-${{ matrix.arch }}.exe /link "build/runtime/src/$vendor.lib" /MANIFEST:EMBED "/MANIFESTUAC:level='asInvoker' uiAccess='false'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /MT /DWIN32 /DNOMINMAX /Isrc /Iexternal/OpenCL-Headers /Iexternal/SPIRV-Headers/include "/I$prefix/include" src/utils.cpp tools/windows-flat-check.cpp /Febuild/package/windows-flat-check-${{ matrix.arch }}.exe /link /MANIFEST:EMBED "/MANIFESTUAC:level='asInvoker' uiAccess='false'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /MT /DWIN32 /DNOMINMAX tools/dispatch-trace-check.cpp /Febuild/package/dispatch-trace-check-${{ matrix.arch }}.exe /link /MANIFEST:EMBED "/MANIFESTUAC:level='asInvoker' uiAccess='false'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /MT /DWIN32 /DNOMINMAX tools/batch-duration-check.cpp /Febuild/package/batch-duration-check-${{ matrix.arch }}.exe /link /MANIFEST:EMBED "/MANIFESTUAC:level='asInvoker' uiAccess='false'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # This is an explicit vendor-candidate control with sibling ICD DLLs.
          # Ordinary system-loader application probes are built by the parent.
          cl /nologo /EHsc /std:c++17 /MT /DWIN32 /DNOMINMAX /Iexternal/OpenCL-Headers tools/viogpu-opencl-dispatch-check.cpp /Febuild/package/viogpu-opencl-dispatch-check-${{ matrix.arch }}.exe /link "build/runtime/src/$vendor.lib" /MANIFEST:EMBED "/MANIFESTUAC:level='asInvoker' uiAccess='false'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/flat-pe.py --output build/package --arch '${{ matrix.arch }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ matrix.arch }}' -ne 'arm64') {
            New-Item -Type Directory build/flat | Out-Null
            Copy-Item build/package/*.dll build/flat/
            Copy-Item compiler/*.dll build/flat/ -ErrorAction SilentlyContinue
            Copy-Item compiler/*.exe build/flat/
            $flat = (Resolve-Path build/flat).Path
            & build/package/windows-flat-check-${{ matrix.arch }}.exe "$flat/$vendor.dll" "$privateVk.dll"
            if ($LASTEXITCODE) { throw 'Flat runtime/compiler test failed' }
            & build/package/dispatch-trace-check-${{ matrix.arch }}.exe
            if ($LASTEXITCODE) { throw 'Production recorder failed' }
            & build/package/batch-duration-check-${{ matrix.arch }}.exe
            if ($LASTEXITCODE) { throw 'Production duration admission failed' }
            & build/package/viogpu-opencl-dispatch-check-${{ matrix.arch }}.exe --help
            if ($LASTEXITCODE) { throw 'Vendor dispatch control CLI failed' }
          }
          dumpbin /headers "build/package/$vendor.dll" "build/package/$privateVk.dll" | Out-File build/package/pe-headers.txt
          dumpbin /exports "build/package/$vendor.dll" | Out-File build/package/exports.txt
          dumpbin /dependents "build/package/$vendor.dll" | Out-File build/package/dependents.txt
          git rev-parse HEAD | Out-File build/package/source.txt
          git submodule status | Out-File -Append build/package/source.txt
          $hashes = Get-ChildItem build/package -File | Get-FileHash -Algorithm SHA256
          $hashes | Where-Object { $_.Path -match '(?i)\.(dll|exe)$' } | ForEach-Object { Write-Output ("PAYLOAD_SHA256 {0} {1}" -f [IO.Path]::GetFileName($_.Path), $_.Hash) }
          $hashes | Format-List | Out-File build/package/sha256.txt
          $hashes | ForEach-Object { $_.Hash + '  ' + [IO.Path]::GetFileName($_.Path) } | Set-Content build/package/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viogpu-opencl-${{ matrix.arch }}
          path: |
            build/package/
            build/runtime/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
  flat-native-arm:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Execute all real flat runtime and compiler paths on ARM64 Windows
        shell: pwsh
        run: |
          $flat = New-Item -Type Directory flat
          foreach ($arch in @('arm64','x64','x86')) {
            Copy-Item "artifacts/viogpu-opencl-$arch/package/*.dll" $flat
          }
          Copy-Item artifacts/viogpu-opencl-compiler-x64/*.dll $flat -ErrorAction SilentlyContinue
          Copy-Item artifacts/viogpu-opencl-compiler-x64/*.exe $flat
          foreach ($arch in @('arm64','x64','x86')) {
            $source = Get-Content "artifacts/viogpu-opencl-$arch/package/source.txt" -First 1
            if ($source.Trim() -ne $env:GITHUB_SHA) { throw "Wrong $arch runtime source" }
            & "artifacts/viogpu-opencl-$arch/package/windows-flat-check-$arch.exe" "$($flat.FullName)/viogpucl_$arch.dll" "viogpucl_vk_$arch.dll"
            if ($LASTEXITCODE) { throw "Native/emulated flat $arch runtime/compiler failed" }
            & "artifacts/viogpu-opencl-$arch/package/dispatch-trace-check-$arch.exe"
            if ($LASTEXITCODE) { throw "Native/emulated $arch production recorder failed" }
            & "artifacts/viogpu-opencl-$arch/package/batch-duration-check-$arch.exe"
            if ($LASTEXITCODE) { throw "Native/emulated $arch production duration admission failed" }
            & "artifacts/viogpu-opencl-$arch/package/viogpu-opencl-dispatch-check-$arch.exe" --help
            if ($LASTEXITCODE) { throw "Native/emulated $arch vendor control CLI failed" }
          }
