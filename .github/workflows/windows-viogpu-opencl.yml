name: Windows VIOGPU OpenCL
on:
  push:
    branches: [viogpu-windows-opencl]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compiler:
    runs-on: windows-2022
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Package matching upstream compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34487278874 -R kpet/clvk -n clvk-windows-2022---compiler-true-online-false -D upstream
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item upstream/clspv.exe
          $expected = '79E236AF8FEBD67FD02ADFD93F81295C87E868E9FD861F71D03D1057E6BE1F9D'
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Compiler identity mismatch' }
          New-Item -Type Directory -Force compiler | Out-Null
          Copy-Item $exe.FullName compiler/
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (!$crt) { throw 'Missing x64 compiler CRT' }
          Copy-Item "$($crt.FullName)/*.dll" compiler/
          & compiler/clspv.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'upstream_run=34487278874; clspv_source=c20f7c8ccf58f317972ac1ffeab68a96019cbbaa; compiler_machine=AMD64; compiler_only=true' | Out-File compiler/source.txt
          $hashes = Get-ChildItem compiler -File | Get-FileHash -Algorithm SHA256
          $hashes | Format-List | Out-File compiler/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: viogpu-opencl-compiler-x64
          path: compiler/
          if-no-files-found: error
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            msvc: amd64_arm64
          - arch: x64
            msvc: amd64
          - arch: x86
            msvc: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned dependencies
        shell: pwsh
        run: |
          git submodule update --init --depth=1 external/clspv external/OpenCL-Headers external/SPIRV-Headers external/SPIRV-Tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --depth=1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Headers.git build/vulkan-headers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --depth=1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Loader.git build/vulkan-loader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build matching Vulkan loader and OpenCL runtime
        shell: pwsh
        run: |
          $prefix = "$pwd/build/deps"
          cmake -S build/vulkan-headers -B build/headers -G Ninja "-DCMAKE_INSTALL_PREFIX=$prefix" -DVULKAN_HEADERS_ENABLE_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/headers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S build/vulkan-loader -B build/loader -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$prefix" "-DCMAKE_PREFIX_PATH=$prefix" -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/loader --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/loader
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$prefix" "-DVulkan_INCLUDE_DIR=$prefix/include" "-DVulkan_LIBRARY=$prefix/lib/vulkan-1.lib" -DCLVK_EXTERNAL_CLSPV=ON -DCLVK_ENABLE_SPIRV_IL=OFF -DCLVK_BUILD_TESTS=OFF -DCLVK_ENABLE_ASSERTIONS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/runtime --parallel 3 --target OpenCL
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -Type Directory -Force build/package | Out-Null
          cmake --install build/runtime --prefix build/package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$prefix/bin/vulkan-1.dll" build/package/
          $crt = Get-ChildItem "$env:VCToolsRedistDir/${{ matrix.arch }}" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (!$crt) { throw 'Missing runtime CRT' }
          Copy-Item "$($crt.FullName)/*.dll" build/package/
          cl /nologo /EHsc /std:c++17 /MD /DWIN32 /DNOMINMAX /Isrc /Iexternal/OpenCL-Headers /Iexternal/SPIRV-Headers/include "/I$prefix/include" src/utils.cpp tools/windows-exec-check.cpp /Febuild/package/windows-exec-check.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ matrix.arch }}' -ne 'arm64') {
            & build/package/windows-exec-check.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cl /nologo /EHsc /std:c++17 /MD /Iexternal/OpenCL-Headers tools/viogpu-opencl-check.cpp /Febuild/package/viogpu-opencl-check.exe /link build/runtime/src/OpenCL.lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dumpbin /headers build/package/OpenCL.dll build/package/vulkan-1.dll build/package/viogpu-opencl-check.exe | Out-File build/package/pe-headers.txt
          dumpbin /exports build/package/OpenCL.dll | Out-File build/package/exports.txt
          dumpbin /dependents build/package/OpenCL.dll | Out-File build/package/dependents.txt
          git rev-parse HEAD | Out-File build/package/source.txt
          git submodule status | Out-File -Append build/package/source.txt
          $hashes = Get-ChildItem build/package -File | Get-FileHash -Algorithm SHA256
          $hashes | Format-List | Out-File build/package/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viogpu-opencl-${{ matrix.arch }}
          path: |
            build/package/
            build/runtime/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
